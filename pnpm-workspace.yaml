packages:
  - apps/*
  - packages/*

nodeLinker: hoisted

publicHoistPattern:
  - "*react*"
  - "*react-dom*"
  - "@tanstack/*"

overrides:
  defu: 6.1.7
  next: 16.2.11
  brace-expansion: 1.1.18
  brace-expansion@5.0.6: 5.0.8
  esbuild@0.18.20: 0.28.1
  esbuild@0.27.4: 0.28.1
  fast-uri: 3.1.5
  js-yaml: 4.3.1
  nanoid@3.3.16: 3.3.17
  picomatch@2.3.1: 2.3.2
  postcss: 8.5.23
  sharp@0.34.5: 0.35.0
  undici: 7.29.0
  uuid@7.0.3: 11.1.1
  esm-env: "npm:esm-env-runtime@^0.1.1"

# pnpm 11 blocks dependency lifecycle scripts unless each package is reviewed.
allowBuilds:
  esbuild: true
  workerd: true
  msgpackr-extract: false
  sharp: false
  unrs-resolver: false

catalog:
  "@orpc/client": 1.14.8
  "@orpc/openapi": 1.14.8
  "@orpc/server": 1.14.8
  "@orpc/tanstack-query": 1.14.8
  "@orpc/zod": 1.14.8
  "@types/react": 19.2.0
  "@types/react-dom": 19.2.0
  "@vitejs/plugin-react": 5.0.1
  react: 19.2.3
  react-dom: 19.2.3
  vite: 8.0.16

minimumReleaseAgeExclude:
  - '@expo/cli@56.1.21'
  - '@expo/config-plugins@56.0.14'
  - '@expo/config@56.0.13'
  - '@expo/fingerprint@0.19.9'
  - '@expo/image-utils@0.10.4'
  - '@expo/metro-config@56.0.18'
  - '@expo/prebuild-config@56.0.21'
  - '@expo/require-utils@56.1.6'
  - '@expo/router-server@56.0.17'
  - babel-preset-expo@56.0.18
  - expo-asset@56.0.21
  - expo-constants@56.0.22
  - expo-modules-autolinking@56.0.21
  - expo-modules-core@56.0.22
  - expo@56.0.18
  - '@expo/metro-runtime@56.0.18'
  - '@expo/ui@56.0.23'
  - expo-dev-client@56.0.24
  - expo-dev-launcher@56.0.25
  - expo-dev-menu@56.0.21
  - expo-image-picker@56.0.22
  - expo-linking@56.0.16
  - expo-router@56.2.17
  - expo-splash-screen@56.0.14
  - expo-updates@56.0.23
  - expo-web-browser@56.0.6
