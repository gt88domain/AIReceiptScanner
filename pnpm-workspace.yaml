packages:
  - apps/*
  - packages/*

nodeLinker: hoisted

publicHoistPattern:
  - "*react*"
  - "*react-dom*"
  - "@tanstack/*"

overrides:
  defu: 6.1.7
  next: 16.2.10
  esm-env: "npm:esm-env-runtime@^0.1.1"

# pnpm 11 blocks dependency lifecycle scripts unless each package is reviewed.
allowBuilds:
  esbuild: true
  workerd: true
  msgpackr-extract: false
  sharp: false
  unrs-resolver: false

catalog:
  "@types/react": 19.2.0
  "@types/react-dom": 19.2.0
  "@vitejs/plugin-react": 5.0.1
  react: 19.2.3
  react-dom: 19.2.3
  vite: 8.0.0
