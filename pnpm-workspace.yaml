packages:
  - apps/*
  - packages/*

nodeLinker: hoisted

publicHoistPattern:
  - "*react*"
  - "*react-dom*"
  - "@tanstack/*"

overrides:
  defu: 6.1.7
  next: 16.2.11
  brace-expansion@5.0.6: 5.0.7
  esbuild@0.18.20: 0.28.1
  esbuild@0.27.4: 0.28.1
  picomatch@2.3.1: 2.3.2
  postcss@8.4.31: 8.5.10
  sharp@0.34.5: 0.35.0
  uuid@7.0.3: 11.1.1
  esm-env: "npm:esm-env-runtime@^0.1.1"

# pnpm 11 blocks dependency lifecycle scripts unless each package is reviewed.
allowBuilds:
  esbuild: true
  workerd: true
  msgpackr-extract: false
  sharp: false
  unrs-resolver: false

catalog:
  "@orpc/client": 1.14.8
  "@orpc/openapi": 1.14.8
  "@orpc/server": 1.14.8
  "@orpc/tanstack-query": 1.14.8
  "@orpc/zod": 1.14.8
  "@types/react": 19.2.0
  "@types/react-dom": 19.2.0
  "@vitejs/plugin-react": 5.0.1
  react: 19.2.3
  react-dom: 19.2.3
  vite: 8.0.16
