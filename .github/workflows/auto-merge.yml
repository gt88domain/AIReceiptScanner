name: Auto merge verified PR

on:
  workflow_run:
    workflows: ["Quality", "Dependency vulnerability scan", "Mobile"]
    types: [completed]

permissions:
  actions: write
  checks: read
  contents: write
  pull-requests: write

jobs:
  merge:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            let pr = context.payload.workflow_run.pull_requests[0];
            if (!pr) {
              const { data: associated } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                ...context.repo,
                commit_sha: context.payload.workflow_run.head_sha,
              });
              pr = associated.find((candidate) => candidate.state === "open");
            }
            if (!pr) return;
            const { data: pull } = await github.rest.pulls.get({ ...context.repo, pull_number: pr.number });
            if (pull.draft || pull.state !== "open") return;

            const { data } = await github.rest.checks.listForRef({
              ...context.repo,
              ref: pull.head.sha,
              per_page: 100,
            });
            const checks = new Map(data.check_runs.map((check) => [check.name, check]));
            const required = ["static", "test", "build", "osv"];
            if (!required.every((name) => checks.get(name)?.conclusion === "success")) return;
            if (checks.has("check") && checks.get("check").conclusion !== "success") return;

            await github.rest.pulls.merge({
              ...context.repo,
              pull_number: pull.number,
              merge_method: "squash",
            });
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo,
              workflow_id: "release-please.yml",
              ref: "main",
            });
