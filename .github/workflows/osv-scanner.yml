name: Dependency vulnerability scan

on:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  osv:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.3.8
    with:
      scan-args: |-
        --lockfile=pnpm-lock.yaml
      # This private repository is not licensed for GitHub Code Security, so
      # uploading SARIF would fail before the actual vulnerability scan runs.
      upload-sarif: false
      fail-on-vuln: true
