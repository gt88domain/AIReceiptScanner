name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:facts-check
      - run: pnpm check:boundaries
      - run: pnpm lint
      - run: pnpm fmt:check
      - run: pnpm check-types

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Downstream adoption checks verify that a recorded release commit is
          # an ancestor of HEAD. The default shallow checkout cannot see it.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:unit
      - run: pnpm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:check
      - run: pnpm build
      - run: pnpm profiles:build
      - run: pnpm perf:budget
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: web-performance-baseline
          path: artifacts/performance/
          if-no-files-found: error

  # Release Please creates its PR with GITHUB_TOKEN, which suppresses the
  # pull_request and workflow_run chain. After Quality succeeds, wake the sole
  # merge implementation; it still verifies OSV, Mobile, files, and head SHA.
  dispatch-release-auto-merge:
    needs: [static, test, build]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { data: associated } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              ...context.repo,
              commit_sha: context.sha,
            });
            const pr = associated.find((candidate) =>
              candidate.state === "open" && candidate.head.ref.startsWith("release-please--"),
            );
            if (!pr) return;
            await github.rest.repos.createDispatchEvent({
              ...context.repo,
              event_type: "release-checks-complete",
              client_payload: { head_sha: context.sha },
            });
